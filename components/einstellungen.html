<!DOCTYPE html>
<html lang="de">
  <head>
    <base href="/">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Einstellungen</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/einstellungen.css">
  </head>

  <body>
    <!-- Header placeholder -->
    <div id="header-placeholder">
      <header>
        <div class="logo-container">
          <a href="index.html">
            <img src="assets/img/bee_logo02.png" alt="Logo" class="logo">
          </a>
          <div class="logo-text">
            <h1>BeeLot</h1>
            <span class="version" id="version-placeholder"></span>
          </div>
        </div>
        <nav>
          <a href="index.html">Home</a>
          <a href="components/faq.html">FAQ</a>
          <a href="components/einstellungen.html">
            <img src="assets/img/gear.png" alt="Einstellungen">
          </a>
        </nav>
      </header>
    </div>

    <script type="module">
      import { VERSION } from "./assets/js/version.js";
      import { loadPageHeader } from "./assets/js/pageFragments.js";

      loadPageHeader(VERSION);
    </script>

    <main>
      <div class="einstellungen-container">
        <!-- Beschreibung für Tracht -->
        <p class="section-description">Hier können blührelevante Parameter eingestellt werden.</p>

        <!-- Heading: Tracht -->
        <button
          type="button"
          class="settings-heading"
          data-target="tracht-content"
          aria-expanded="false"
          aria-controls="tracht-content"
        >
          <span>Tracht</span>
          <span class="arrow" aria-hidden="true">▶</span>
        </button>
        <div class="settings-content" id="tracht-content" hidden>
          <p>Hier kannst du Tracht-Einträge bearbeiten.</p>
          <table id="tracht-table">
            <thead>
              <tr>
                <th rowspan="2" class="checkbox-cell">Aktiv</th>
                <th colspan="2">Temperatur Summe</th>
                <th rowspan="2" class="plant-cell">Pflanze</th>
                <th rowspan="2" class="trash-cell">Löschen</th>
                <th rowspan="2">URL</th>
              </tr>
              <tr>
                <th class="numeric-cell">Start</th>
                <th class="numeric-cell">Ende</th>
              </tr>
            </thead>
            <tbody>
              <!-- Populated by JS -->
            </tbody>
          </table>
          <button class="add-button" id="add-tracht-row-button">+ Zeile hinzufügen</button>
          <button class="reset-button" id="reset-tracht-data-button">RESET</button>
        </div>

        <!-- Beschreibung für Sonstiges         -->
        <p class="section-description">Technische Einstellungen</p>

        <!-- Heading: Sonstiges -->
        <button
          type="button"
          class="settings-heading"
          data-target="sonstiges-content"
          aria-expanded="false"
          aria-controls="sonstiges-content"
        >
          <span>System</span>
          <span class="arrow" aria-hidden="true">▶</span>
        </button>

        <div class="settings-content" id="sonstiges-content" hidden>
          <p>Local Storage</p>

          <!-- Clear Local Storage Buttons -->
          <div style="text-align: center; margin-top: 20px;">
            <button class="red-button" id="clear-local-storage-button">Clear Local Storage</button>
            <button class="red-button" id="clear-cache-button">Clear Cache</button>
          </div>
        </div>
      </div>
    </main>

    <!-- settings.js -->
    <script type="module" src="assets/js/settings.js"></script>

    <!-- Footer -->
    <div id="footer-placeholder"></div>
    <script type="module">
      import { loadPageFooter } from "./assets/js/pageFragments.js";

      loadPageFooter();
    </script>
  </body>
</html>
